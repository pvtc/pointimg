[package]
name = "pointimg"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
description = "A pointillist filter that transforms images into compositions of colored dots"
license = "MIT"
repository = "https://github.com/pvtc/pointimg"
documentation = "https://docs.rs/pointimg"
readme = "README.md"
keywords = ["image-processing", "pointillism", "halftone", "dithering", "voronoi"]
categories = ["multimedia::images", "command-line-utilities"]
# The `fuzz/` folder is a separate package (its own Cargo.toml/lock): it is
# automatically excluded from the published package. `assets/` stays included
# because the README links the example images relatively.
exclude = ["/.github", "/.idea"]

[lib]
name = "pointimg"
path = "src/lib.rs"

[[bin]]
name = "pointimg"
path = "src/main.rs"

[[bin]]
name = "pointimg-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[[bin]]
name = "pointimg-gtk"
path = "src/gtk/main.rs"
required-features = ["gtk"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:wgpu", "dep:rfd"]
gtk = ["dep:gtk", "dep:adw", "dep:async-channel"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Optional output codec (AVIF encoding pulls in ravif, heavier to compile).
# WebP is already included by default in the `image` crate.
avif = ["image/avif"]

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
moxcms = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
log = "0.4"
env_logger = "0.11"
egui = { version = "0.37", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
rfd = { version = "0.18", optional = true }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"], optional = true }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"], optional = true }
async-channel = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
glob = "0.3"

# Explicit declaration for IDEs/Cargo metadata; the extra Linux features are
# added in the target-specific dependency below.
# `persistence`: eframe then saves its state (window size, panel width, current
# theme) in the application data directory. Our UI preferences (scale, theme)
# have their own file, written immediately — see `src/gui/prefs.rs`.
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "persistence"], optional = true }
gettext = "0.4.0"

# eframe is configured per platform: the wayland/x11 features only exist on
# Linux. On macOS/Windows only wgpu + accesskit are kept.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit", "persistence"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "accesskit", "persistence"], optional = true }

# ─── Dev (tests/benches) ──────────────────────────────────────────────────────

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "filter"
harness = false

[[test]]
name = "gpu_density"
required-features = ["gpu"]

# ─── Profiles ─────────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1          # keeps debug builds fast enough on images

[profile.release]
opt-level = 3
lto = "thin"           # light link-time optimisation
codegen-units = 1      # maximum cross-module optimisation (slower build)
strip = true           # release binaries without symbols

# ─── Lints ────────────────────────────────────────────────────────────────────

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
perf = "warn"
complexity = "warn"

[lints.cargo]
# Cargo 1.100: reports a dependency declared but never used.
unused_dependencies = "deny"

# ─── Documentation (docs.rs) ──────────────────────────────────────────────────

[package.metadata.docs.rs]
# `gtk` is excluded: GTK4/libadwaita are not available on the docs.rs builder.
features = ["gui", "gpu", "avif"]
rustdoc-args = ["--cfg", "docsrs"]
