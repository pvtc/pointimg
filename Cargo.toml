[package]
name = "pointimg"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A pointillist filter that transforms images into compositions of colored dots"

[lib]
name = "pointimg"
path = "src/lib.rs"

[[bin]]
name = "pointimg"
path = "src/main.rs"

[[bin]]
name = "pointimg-gui"
path = "src/gui/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:wgpu", "dep:rfd"]
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]
# Codec de sortie optionnel (l'encodage AVIF implique ravif, plus lourd à compiler).
# WebP est déjà inclus par défaut dans la crate `image`.
avif = ["image/avif"]

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "bmp",
    "gif",
    "jpeg",
    "png",
    "tiff",
    "webp",
] }
moxcms = "0.9"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
log = "0.4"
env_logger = "0.11"
egui = { version = "0.36", optional = true }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
pollster = { version = "1", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
rfd = { version = "0.17", optional = true }
serde = { version = "1", features = ["derive"] }
toml = "1"
glob = "0.3"

# Déclaration explicite pour les IDE/Cargo metadata ; les features Linux
# supplémentaires sont ajoutées dans la dépendance target-specific ci-dessous.
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit"], optional = true }

# eframe est configuré par plateforme : les features wayland/x11 n'existent
# que sur Linux. Sur macOS/Windows on garde uniquement wgpu + accesskit.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "accesskit"], optional = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
eframe = { version = "0.36", default-features = false, features = ["wgpu", "accesskit"], optional = true }

# ─── Dev (tests/benches) ──────────────────────────────────────────────────────

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "filter"
harness = false

[[test]]
name = "gpu_density"
required-features = ["gpu"]

# ─── Profils ──────────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1          # évite que le debug soit trop lent sur les images

[profile.release]
opt-level = 3
lto = "thin"           # link-time optimisation légère

# ─── Lints ────────────────────────────────────────────────────────────────────

[lints.rust]
unused_imports = "warn"
dead_code = "warn"

[lints.clippy]
perf = "warn"
complexity = "warn"

# ─── Documentation (docs.rs) ──────────────────────────────────────────────────

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
