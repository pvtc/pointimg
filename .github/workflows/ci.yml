name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `gtk` is excluded from --all-features: it needs GTK4/libadwaita
      # installed (dedicated Linux-only job below).
      # `--all-targets` also lints tests, benches and examples.
      - run: cargo clippy --features gui,gpu,avif --all-targets -- -D warnings
      # Coverage of the CLI-only build (no GUI dependencies).
      - name: Clippy (CLI-only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features gui,gpu,avif --locked
      # The CLI-only build must stay tested (no GUI dependencies).
      - name: Test (CLI-only)
        run: cargo test --no-default-features --locked

  gpu:
    name: GPU parity (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan software rasterizer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
      - uses: Swatinem/rust-cache@v2
      - name: Verify software adapter is visible
        run: vulkaninfo --summary | grep -i llvmpipe
      - name: CPU/GPU density parity test
        env:
          POINTIMG_GPU: "1"
        run: |
          # Force the software rasterizer. The lavapipe ICD was renamed from
          # `lvp_icd.x86_64.json` to `lvp_icd.json` in newer Mesa packages, so
          # resolve it instead of hardcoding a name that may not exist on
          # `ubuntu-latest`.
          ls -l /usr/share/vulkan/icd.d/
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -n 1)
          test -n "$icd" || { echo "lavapipe ICD not found" >&2; exit 1; }
          echo "lavapipe ICD: $icd"
          # `VK_ICD_FILENAMES` is the legacy name of `VK_DRIVER_FILES`: set both
          # so the loader version on the image does not matter.
          VK_DRIVER_FILES="$icd" VK_ICD_FILENAMES="$icd" \
            cargo test --locked --features gpu --test gpu_density -- --nocapture

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.100", stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ matrix.toolchain }} check --features gui,gpu,avif --locked

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features gui,gpu,avif

  gtk:
    name: GTK4 GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --no-default-features --features gtk --bin pointimg-gtk -- -D warnings
      - name: Test (lib + CLI)
        run: cargo test --no-default-features --features gtk --locked
      - name: Build (release)
        run: cargo build --release --no-default-features --features gtk --bin pointimg-gtk

  packaging:
    name: Packaging metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils appstream flatpak-builder
      # `desktop-file-validate` catches dangling actions, bogus MIME types and
      # malformed keys; `appstreamcli` checks the metadata shown by software
      # centres. Both are cheap and run before a release can ship them.
      - name: Validate desktop entries
        run: desktop-file-validate packaging/*.desktop
      - name: Validate AppStream metadata
        run: appstreamcli validate --no-net packaging/*.metainfo.xml
      # Parse the Flatpak manifest (sources, YAML keys, app id) without
      # downloading a runtime or building the app.
      - name: Validate Flatpak manifest
        run: flatpak-builder --show-manifest packaging/flatpak/io.github.pvtc.pointimg-gtk.yml > /dev/null

  i18n:
    name: Translations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `msgfmt` is used when available: the committed .mo must be reproduced
      # byte for byte, or the diff fails for the wrong reason.
      - name: Install gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext
      # The catalogue is derived from the `gettext("…")` calls in the code.
      # The script fails (exit 1) as soon as a msgid has no English translation.
      - name: Regenerate the catalogue
        run: python3 scripts/sync-i18n.py
      - name: Check the committed catalogue is up to date
        # `#:` source references are metadata: any refactor that moves a
        # `gettext()` call rewrites them without changing a single string.
        # Ignore them so the job only gates on real catalogue changes.
        run: "git diff --exit-code -I '^#: ' -- locales/"

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features gui,gpu,avif

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: Licenses and sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check

  fuzz-build:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    # cargo-fuzz needs nightly (sanitizer coverage). The stable
    # `rust-toolchain.toml` at the root would override the toolchain installed
    # by the action, so nightly is forced explicitly for this job.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo fuzz build --dev --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - run: cargo fuzz run image --dev --target x86_64-unknown-linux-gnu -- -runs=100
        working-directory: fuzz
      - run: cargo fuzz run preset --dev --target x86_64-unknown-linux-gnu -- -runs=100
        working-directory: fuzz
