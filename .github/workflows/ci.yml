name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `gtk` est exclu de --all-features : il exige GTK4/libadwaita installés
      # (job dédié ci-dessous, Linux uniquement).
      # `--all-targets` lint aussi les tests, benches et exemples.
      - run: cargo clippy --features gui,gpu,avif --all-targets -- -D warnings
      # Couverture du build CLI-only (aucune dépendance GUI).
      - name: Clippy (CLI-only)
        run: cargo clippy --no-default-features --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features gui,gpu,avif --locked
      # Le build CLI-only doit rester testé (pas de dépendances GUI).
      - name: Test (CLI-only)
        run: cargo test --no-default-features --locked

  gpu:
    name: GPU parity (lavapipe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Vulkan software rasterizer (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers vulkan-tools
      - uses: Swatinem/rust-cache@v2
      - name: Verify software adapter is visible
        run: vulkaninfo --summary | grep -i llvmpipe
      - name: CPU/GPU density parity test
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          POINTIMG_GPU: "1"
        run: cargo test --locked --features gpu --test gpu_density -- --nocapture

  msrv:
    name: MSRV (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: ["1.95", stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ matrix.toolchain }} check --features gui,gpu,avif --locked

  build:
    name: Build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features gui,gpu,avif

  gtk:
    name: GTK4 GUI (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install GTK4 and libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --no-default-features --features gtk --bin pointimg-gtk -- -D warnings
      - name: Test (lib + CLI)
        run: cargo test --no-default-features --features gtk --locked
      - name: Build (release)
        run: cargo build --release --no-default-features --features gtk --bin pointimg-gtk

  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg docsrs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features gui,gpu,avif

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  fuzz-build:
    name: Fuzz smoke tests
    runs-on: ubuntu-latest
    # cargo-fuzz a besoin de nightly (sanitizer coverage). Le
    # `rust-toolchain.toml` stable de la racine l'emporterait sur le toolchain
    # installé par l'action : on force explicitement nightly pour ce job.
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-fuzz
        with:
          tool: cargo-fuzz
      - run: cargo fuzz build --dev --target x86_64-unknown-linux-gnu
        working-directory: fuzz
      - run: cargo fuzz run image --dev --target x86_64-unknown-linux-gnu -- -runs=100
        working-directory: fuzz
      - run: cargo fuzz run preset --dev --target x86_64-unknown-linux-gnu -- -runs=100
        working-directory: fuzz
