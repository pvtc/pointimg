version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # GTK4/libadwaita bumps are grouped: they must stay compatible with the
    # distro versions targeted by the CI jobs.
    groups:
      gtk-stack:
        patterns:
          - gtk4
          - libadwaita
      # egui and eframe must move together: eframe requires the matching egui
      # minor, so two separate PRs each leave the lockfile inconsistent and
      # every `--locked` check fails.
      egui-stack:
        patterns:
          - egui
          - eframe

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
