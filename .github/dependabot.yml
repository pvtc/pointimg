version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # GTK4/libadwaita bumps are grouped: they must stay compatible with the
    # distro versions targeted by the CI jobs.
    groups:
      gtk-stack:
        patterns:
          - gtk4
          - libadwaita

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
